[project]
name = "xinyidai-agent"
version = "0.1.0"
description = "信易贷聊天 Agent 重构工程"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "openai>=1.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py311"
